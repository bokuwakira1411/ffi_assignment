# FPO (Flow Policy Optimization) on SmolVLA, plan: results/round2/fpo_plan.md
# Start checkpoint lerobot/smolvla_libero, NAS = 10. Same training groups as round 1
# (16 init states x G=8 per task); the other 34 init states per task stay held out.
n_action_steps: 10
iterations: 4
init_policy: lerobot/smolvla_libero
out_root: ~/ffi26/improve/outputs/fpo
reward: {lam: 0.5, gamma: 0.998, success_bonus: 1.0,
         costs: {drop: 0.2, slip: 0.1, collision: 0.1, timeout: 0.2}}
collect:
  seed: 200000              # iteration k: env seed of rollout j in group g = seed + seed_iter_stride*k + 1000*g + j
  seed_iter_stride: 100000
  group_size: 8
  min_return_spread: 0.1
  adv_deadzone: 0.02        # labels only (stats); FPO uses the raw advantage
  tasks:
    - task_id: 0
      init_ids: [1, 4, 6, 7, 9, 16, 19, 21, 22, 28, 31, 34, 37, 38, 41, 48]
    - task_id: 8
      init_ids: [26, 27, 33, 39, 43, 10, 13, 14, 16, 22, 30, 38, 40, 41, 44, 46]
fpo:
  n_pairs: 2                # (tau, eps) pairs per decision (old-loss pass: 26 s per 637 decisions x 4 pairs)
  batch_size: 32            # decisions per step (one task per step)
  epochs: 2
  lr: 1.0e-6                # V6b sweep (smoke, 38 steps): 1e-5 clip_frac 0.72, 3e-6 0.23, 1e-6 0.01
  warmup: 20
  clip: 0.2
  ratio_scale: auto         # r = exp(c (l_old - l_new)), c = 1/mean(l_old) (V4: with c = 1 good actions are never clipped)
  grad_clip: 10.0
  early_stop_clip_frac: 0.2 # stop the iteration when clip_frac over the last early_stop_window steps > 0.2
  early_stop_window: 10
  seed: 3000
