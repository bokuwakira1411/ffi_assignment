other_tasks: [1, 2, 3, 4, 5, 6, 7, 9]
heldout_from: ~/ffi26/results/round2/configs/round1.yaml
reference: official
out_dir: ~/ffi26/results/round2/fpo_v2/seed1000_other
gap_pairs: []
models:
