    label: checkpoint chính thức, expert fp32, seed 1000
    root: ~/ffi26/improve/outputs/fpo_v2/eval_s1000/official
  - name: fpo_v1_it3
    label: FPO v1 θ3, expert fp32, seed 1000
    root: ~/ffi26/improve/outputs/fpo_v2/eval_s1000/fpo_v1_it3
  - name: fpo_v2_sel
    label: FPO v2 (checkpoint theo quy tắc collapse), expert fp32, seed 1000
    root: ~/ffi26/improve/outputs/fpo_v2/eval_s1000/fpo_v2_sel
