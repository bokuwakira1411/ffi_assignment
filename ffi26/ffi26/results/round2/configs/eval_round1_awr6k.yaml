# Round-1 data, AWR full run (6000 steps, cosine decay to 6000, checkpoints 2k/4k/6k): no label.
# Trained tasks 50 ep, other 8 tasks 20 ep, per checkpoint.
seed: 1000
n_action_steps: 10
batch_size: 8
output_dir: ~/ffi26/improve/outputs/r2/eval
models:
  - name: awr6k_r1_s2000
    path: /home/student/ffi26/improve/outputs/r2/train_awr6k_round1/checkpoints/002000/pretrained_model
    task_suffix: ""
    jobs:
      - {tasks: [0, 8], n_episodes: 50}
      - {tasks: [1, 2, 3, 4, 5, 6, 7, 9], n_episodes: 20}
  - name: awr6k_r1_s4000
    path: /home/student/ffi26/improve/outputs/r2/train_awr6k_round1/checkpoints/004000/pretrained_model
    task_suffix: ""
    jobs:
      - {tasks: [0, 8], n_episodes: 50}
      - {tasks: [1, 2, 3, 4, 5, 6, 7, 9], n_episodes: 20}
  - name: awr6k_r1_s6000
    path: /home/student/ffi26/improve/outputs/r2/train_awr6k_round1/checkpoints/006000/pretrained_model
    task_suffix: ""
    jobs:
      - {tasks: [0, 8], n_episodes: 50}
      - {tasks: [1, 2, 3, 4, 5, 6, 7, 9], n_episodes: 20}
