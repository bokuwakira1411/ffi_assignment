    path: /home/student/ffi26/improve/outputs/fpo/iter2/train/pretrained_model
    task_suffix: ""
    jobs:
      - {tasks: [0, 8], n_episodes: 50}
      - {tasks: [1, 2, 3, 4, 5, 6, 7, 9], n_episodes: 20}
