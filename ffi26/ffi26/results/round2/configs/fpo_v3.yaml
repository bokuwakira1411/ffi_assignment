# FPO v3 on SmolVLA (01/11/2026) = v2 (fpo_v2.yaml) + 3 changes aimed at the 3 problems diagnosed in v2
# (docs/WORKLOG.md 01/11/2026): everything else IDENTICAL to v2 (theta0, fp32 expert, tasks 0 / 8 and init_ids,
# 4 iterations, batch 128, 256 collection episodes / iteration with the SAME collection seeds as v2, lambda_bc 5,
# collapse rule, reward / Phi). Iteration-0 collection (theta0, same seeds) is reused from outputs/fpo_v2/iter0.
#   (1) forgetting: demo replay. + lambda_demo * L_CFM(demo) per step, demo_batch samples from LIBERO-10 demos
#       (data/r2/demos_libero10, all 10 tasks, stratified), cached by scripts/fpo_build_demo_cache.py with the
#       official checkpoint's preprocessor; lambda_demo = lambda_bc. (fallback if the demo format cannot be fixed:
#       self-distillation from theta0, see docs/WORKLOG.md for which one was used)
#   (2) task 0 / task 8 trade-off: advantage normalised (mean / std) per task per iteration, and every optimizer
#       step has batch_size / 2 decisions of each task (v2: one task per step, A / std over both tasks).
#   (3) (optional) pairs_per_step: (tau, eps) pairs averaged per decision in the ratio (v2: 1 random pair of n_pairs);
#       2 only if it costs < 30% extra time per step (measured in the smoke test) -- see fpo.pairs_per_step.
n_action_steps: 10
expert_fp32: true
iterations: 4
init_policy: lerobot/smolvla_libero
out_root: ~/ffi26/improve/outputs/fpo_v3
reward: {lam: 0.5, gamma: 0.998, success_bonus: 1.0,
         costs: {drop: 0.2, slip: 0.1, collision: 0.1, timeout: 0.2}}
collect:
  seed: 1200000             # = v2. iteration k, group g, rollout j: seed + 100000 k + 1000 g + j
  seed_iter_stride: 100000
  group_size: 8
  min_return_spread: 0.1
  adv_deadzone: 0.02
  tasks:
    - task_id: 0
      init_ids: [1, 4, 6, 7, 9, 16, 19, 21, 22, 28, 31, 34, 37, 38, 41, 48]
    - task_id: 8
      init_ids: [26, 27, 33, 39, 43, 10, 13, 14, 16, 22, 30, 38, 40, 41, 44, 46]
fpo:
  n_pairs: 2
  batch_size: 128           # decisions per optimizer step (v3: batch_size / 2 per task, see balanced_tasks)
  micro_batch: 32           # accumulation: batch_size / micro_batch micro-batches
  epochs: 3                 # cap
  lr: 1.0e-6
  warmup_samples: 640       # = v1 (20 steps x 32) -> 5 steps at batch 128
  clip: 0.2
  ratio_scale: auto         # c = 1 / mean(l_old), l_old in fp32
  grad_clip: 10.0
  early_stop_clip_frac: 0.2 # on fp32 ratios, mean over the last early_stop_window steps
  early_stop_window: 10
  seed: 3000
  lambda_bc: 5.0            # dry run: lambda * |grad BC(lambda=1)| ~ 0.25 * |grad PPO|: 0.25 * 18.8 / 0.91 = 5.2 -> 5
  bc_batch: 32              # successful-rollout decisions per step, fresh (tau, eps)
  kl_probe_per_task: 128    # fixed decisions + (tau, eps) for the KL proxy vs theta0
  kl_every: 10              # steps
  # --- v3 ---
  per_task_adv_norm: true   # (2) A^ = clip((A - mean_t) / std_t, -5, 5), t = task, per iteration
  balanced_tasks: true      # (2) every step: batch_size / 2 decisions of task 0 + batch_size / 2 of task 8
  lambda_demo: 5.0          # (1) = lambda_bc
  demo_batch: 32            # (1) demo samples per step, stratified over the 10 tasks
  demo_probe_every: 0       # demo-probe L_CFM (8 untrained tasks) at start / end of each iteration only
  pairs_per_step: 1         # (3) DROPPED: smoke test 2 pairs = 10.71 s/step (micro 16; micro 32 OOM) vs 6.29 s/step = +70% > 30%
demo:
  dataset_dir: ~/ffi26/improve/data/r2/demos_libero10
  repo_id: local/ffi26_r2_demos_libero10
  cache_dir: ~/ffi26/improve/data/fpo_v3
  per_task: 200             # training samples per task (frames uniform over the task's non-probe episodes)
  probe_episodes: 6         # episodes per task held out for the probe
  probe_per_task: 64
  probe_seed: 4242          # fixed (tau, eps) of the probe
  seed: 3030
