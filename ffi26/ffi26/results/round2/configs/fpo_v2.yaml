# FPO v2 on SmolVLA (31/10/2026). Same as fpo.yaml (v1) except the `fpo:` training block and new collection seeds.
# Changes vs v1 (approved, see docs/WORKLOG.md):
#   - batch 128 decisions/step (4 x 32 accumulated), fp32 master weights persisting across iterations;
#     gradient cosine of disjoint batches at theta0: 32 -0.03, 128 0.08, 256 0.07, 512 0.11 -> 128 (rule: 512 if >= 0.2,
#     256 if clearly above 128, else 128);
#   - fp32 forward (no autocast, TF32 off) for l_old / l_new on the same stored (tau, eps); clip_frac / early stop on fp32;
#   - anchor: lambda_bc * CFM loss on the iteration's successful rollouts + KL proxy vs theta0 logged;
#   - at most 3 epochs per iteration.
#   - collection (behaviour policy) and eval load the action expert in fp32 (expert_fp32: true; VLM stays bf16), so the
#     behaviour policy uses exactly the fp32 master weights being trained (v1 rounded 129/145 expert tensors to bf16).
# Pre-registered selection (collapse rule): report the FINAL iteration (theta4) unless collection success of iteration
# k+1 drops more than 15 points below iteration k; then report the last checkpoint before the drop (theta_k). Decided
# only from collection success (an extra collection with theta4, iteration 4, no training), never from eval.
n_action_steps: 10
expert_fp32: true
iterations: 4
init_policy: lerobot/smolvla_libero
out_root: ~/ffi26/improve/outputs/fpo_v2
reward: {lam: 0.5, gamma: 0.998, success_bonus: 1.0,
         costs: {drop: 0.2, slip: 0.1, collision: 0.1, timeout: 0.2}}
collect:
  seed: 1200000             # NEW (v1: 200000; r2 round 1: 100000). iteration k, group g, rollout j: seed + 100000 k + 1000 g + j
  seed_iter_stride: 100000
  group_size: 8
  min_return_spread: 0.1
  adv_deadzone: 0.02
  tasks:
    - task_id: 0
      init_ids: [1, 4, 6, 7, 9, 16, 19, 21, 22, 28, 31, 34, 37, 38, 41, 48]
    - task_id: 8
      init_ids: [26, 27, 33, 39, 43, 10, 13, 14, 16, 22, 30, 38, 40, 41, 44, 46]
fpo:
  n_pairs: 2
  batch_size: 128           # decisions per optimizer step (one task per step)
  micro_batch: 32           # accumulation: batch_size / micro_batch micro-batches
  epochs: 3                 # cap
  lr: 1.0e-6
  warmup_samples: 640       # = v1 (20 steps x 32) -> 5 steps at batch 128
  clip: 0.2
  ratio_scale: auto         # c = 1 / mean(l_old), l_old in fp32
  grad_clip: 10.0
  early_stop_clip_frac: 0.2 # on fp32 ratios, mean over the last early_stop_window steps
  early_stop_window: 10
  seed: 3000
  lambda_bc: 5.0            # dry run: lambda * |grad BC(lambda=1)| ~ 0.25 * |grad PPO|: 0.25 * 18.8 / 0.91 = 5.2 -> 5
  bc_batch: 32              # successful-rollout decisions per step, fresh (tau, eps)
  kl_probe_per_task: 128    # fixed decisions + (tau, eps) for the KL proxy vs theta0
  kl_every: 10              # steps
