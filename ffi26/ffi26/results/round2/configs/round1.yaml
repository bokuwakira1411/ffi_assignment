# Round 2 study, iteration (round) 1: collect with the OFFICIAL checkpoint.
# Budget: 2 tasks x 16 start states x G=8 = 256 rollouts. Held-out: the other 34 init states per task.
round: 1
policy: lerobot/smolvla_libero
n_action_steps: 10
collect_task_suffix: ""          # official checkpoint has never seen the suffix
seed: 100000                      # env seed of rollout j in group g = seed + 1000*g + j
group_size: 8
noise_scale: 1.0
reward: {lam: 0.5, gamma: 0.998, success_bonus: 1.0,
         costs: {drop: 0.2, slip: 0.1, collision: 0.1, timeout: 0.2}}
min_return_spread: 0.1            # drop group if spread < 0.1, unless all rollouts succeed (-> all positive)
adv_deadzone: 0.02               # |A| <= 0.02 -> "none" (no suffix); time-only differences between near-identical segments
tasks:
  # task 0: all 16 init states with mixed success over lerobot-eval D_nas10 seeds 1000-1002
  - task_id: 0
    init_ids: [1, 4, 6, 7, 9, 16, 19, 21, 22, 28, 31, 34, 37, 38, 41, 48]
  # task 8: 16 of 23 mixed init states closest to 50% success over all baseline samples on disk
  # (D_nas10 x3 + outputs/eval_baseline + Phase-1 for init<20); ties -> lower id
  - task_id: 8
    init_ids: [26, 27, 33, 39, 43, 10, 13, 14, 16, 22, 30, 38, 40, 41, 44, 46]
rtf_groups: []                    # reset-to-failure groups, from round 2 on
output_dir: ~/ffi26/improve/outputs/r2/round1
dataset_dir: ~/ffi26/improve/data/r2/rollouts_round1
dataset_repo_id: local/ffi26_r2_rollouts_round1
build:
  demo_root: ~/ffi26/improve/data/lerobot_libero
  target_task_texts:
    - put both the alphabet soup and the tomato sauce in the basket
    - put both moka pots on the stove
  demos_task_texts:   # all 10 libero_10 tasks (order = task id 0..9)
    - put both the alphabet soup and the tomato sauce in the basket
    - put both the cream cheese box and the butter in the basket
    - turn on the stove and put the moka pot on it
    - put the black bowl in the bottom drawer of the cabinet and close it
    - put the white mug on the left plate and put the yellow and white mug on the right plate
    - pick up the book and place it in the back compartment of the caddy
    - put the white mug on the plate and put the chocolate pudding to the right of the plate
    - put both the alphabet soup and the cream cheese box in the basket
    - put both moka pots on the stove
    - put the yellow and white mug in the microwave and close it
  demos_suffix: ""
  demos_out: ~/ffi26/improve/data/r2/demos_libero10
  demos_repo_id: local/ffi26_r2_demos_libero10
  # (train variants: --mode a1 text suffix | a1emb label embedding, --out outputs/r2/train_a1emb_round1 | awr)
  # dataset build (scripts/r2_build.py)
  seed: 1000
  train_out: ~/ffi26/improve/data/r2/train_round1
  train_repo_id: local/ffi26_r2_train_round1
  stats_dir: ~/ffi26/results/round2/round1
  rollout_rounds:
    - {round: 1, dataset_dir: ~/ffi26/improve/data/r2/rollouts_round1, repo_id: local/ffi26_r2_rollouts_round1,
       output_dir: ~/ffi26/improve/outputs/r2/round1}
cfg_drop: 0.3
train:   # scripts/train_r2.py -> lerobot-train
  init_policy: lerobot/smolvla_libero     # round r>1: previous round's checkpoint
  steps: 2000
  batch_size: 32
  lr: 1.0e-5
  warmup: 100
  decay_lr: 2.5e-6
  out: ~/ffi26/improve/outputs/r2/train_a1_round1
