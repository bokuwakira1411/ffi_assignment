# FPO v4, seed 4000, expert fp32: v4 selected checkpoint, tasks 0, 8 x 50 init states (= v2 protocol,
# outputs/fpo_v2/configs/eval_fpo_v2_s4000.yaml). Official / v2 episodes reused from outputs/fpo_v2/eval_s4000 for pairing.
# Template: fpo_v4_loop.sh replaces /home/student/ffi26/improve/outputs/fpo_v4/iter3/train/pretrained_model and writes outputs/fpo_v4/configs/eval_fpo_v4_s4000.yaml.
seed: 4000
n_action_steps: 10
batch_size: 8
expert_fp32: true
output_dir: ~/ffi26/improve/outputs/fpo_v4/eval_s4000
models:
  - name: fpo_v4_sel
    path: /home/student/ffi26/improve/outputs/fpo_v4/iter3/train/pretrained_model
    task_suffix: ""
    jobs:
      - {tasks: [0, 8], n_episodes: 50}
